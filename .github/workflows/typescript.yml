name: TypeScript
on: [push, pull_request]
permissions:
  contents: read
jobs:
  sdk:
    name: SDK (wb-auth)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Dependency audit
        run: npm audit --workspace=wb-auth --omit=dev --audit-level=high
      - name: Lint (biome)
        run: npm run lint --workspace=wb-auth
      - name: Type check
        run: npm run typecheck --workspace=wb-auth
      - name: Build
        run: npm run build --workspace=wb-auth
      - name: Tests
        run: npm run test --workspace=wb-auth
      - name: Package smoke test (ESM + CJS)
        working-directory: typescript
        run: |
          node --input-type=module -e 'import { Identity } from "wb-auth"; if (typeof Identity !== "function") process.exit(1)'
          node -e 'const { Identity } = require("wb-auth"); if (typeof Identity !== "function") process.exit(1)'
  directory:
    name: Directory Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run typecheck --workspace=wbauth-directory
      - name: Tests (workerd + D1)
        run: npm run test --workspace=wbauth-directory
