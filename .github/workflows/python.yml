name: Python
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.0"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Sync workspace (locked)
        run: uv sync --locked --all-extras --dev --all-packages
      - name: Lint (ruff, pinned in uv.lock)
        run: uv run ruff check python/
      - name: Type check (pyright, pinned in uv.lock)
        # cd into python/ so pyright auto-discovers `python/pyrightconfig.json`.
        run: cd python && uv run pyright src tests
      - name: Tests
        run: uv run pytest python/tests -q
