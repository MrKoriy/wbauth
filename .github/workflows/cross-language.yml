name: cross-language

# Python-signed requests must verify in TypeScript (Cloudflare's web-bot-auth)
# and vice versa, on randomized inputs — catches signer drift between SDKs.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.13.0"
          enable-cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: uv sync --locked --all-packages
      - run: npm ci
      - name: Python signs → TypeScript verifies
        run: |
          uv run python python/scripts/cross_sign.py 500 > /tmp/py-signed.json
          (cd typescript && npx tsx scripts/cross-verify.ts /tmp/py-signed.json)
      - name: TypeScript signs → Python verifies
        run: |
          (cd typescript && npx tsx scripts/cross-sign.ts 500 > /tmp/ts-signed.json)
          uv run python python/scripts/cross_verify.py /tmp/ts-signed.json
